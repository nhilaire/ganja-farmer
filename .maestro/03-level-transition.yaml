appId: io.github.nhilaire.ganjafarmer
name: Level transition - skip-level cheat, transition screen, next level
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Help the farm grow?"
    timeout: 15000
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-play"
- assertVisible: "Level: 01"
# AC-22, AC-31: 3 quick taps in the top-left corner complete the level (all 26 plants alive).
- tapOn:
    point: "3%,4%"
    repeat: 3
    delay: 120
- extendedWaitUntil:
    visible: "LEVEL 2"
    timeout: 10000
- assertVisible: "+1000 pts"
- assertNotVisible: ".*Plants Restored.*"
- extendedWaitUntil:
    visible: "Tap to continue"
    timeout: 5000
- takeScreenshot: 06-level-transition
- tapOn: "Tap to continue"
- extendedWaitUntil:
    visible: "Level: 02"
    timeout: 5000
- takeScreenshot: 07-level-2
