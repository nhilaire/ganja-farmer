appId: io.github.nhilaire.ganjafarmer
name: Consent and home - first launch splash, English consent, refuse, home, no consent on relaunch
tags:
  - smoke
---
# AC-06: the artwork splash shows first, in landscape fullscreen.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "splash-screen"
    timeout: 10000
- takeScreenshot: 01-splash
# Android shows a one-time "Viewing full screen" tip on a fresh device: dismiss it if present.
- tapOn:
    text: "Got it"
    optional: true
# AC-01: consent in English with two buttons of equal size.
- extendedWaitUntil:
    visible: "Help the farm grow?"
    timeout: 10000
- assertVisible:
    id: "consent-accept"
- assertVisible:
    id: "consent-refuse"
- takeScreenshot: 02-consent
# AC-02: refusing leads home.
- tapOn:
    id: "consent-refuse"
- assertVisible:
    id: "home-screen"
# AC-07: home content.
- assertVisible: "GANJA"
- assertVisible: "FARMER"
- assertVisible: "Defend your field, Rasta!"
- assertVisible: "PLAY"
- assertVisible: "Touch screen to aim and shoot"
- assertVisible: "Hold to fire continuously"
- assertVisible: "Protect your ganja plants!"
- assertVisible: "SCORES"
- assertVisible: "ABOUT"
- assertVisible: "SETUP"
- takeScreenshot: 03-home
- takeScreenshot: readme-1-home
# AC-02: the choice is remembered.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- assertNotVisible: "Help the farm grow?"
