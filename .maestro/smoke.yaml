appId: io.github.nhilaire.ganjafarmer
name: Smoke - first launch, refuse telemetry, play one round
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Votre vie privée"
- takeScreenshot: 01-consent
- tapOn:
    id: "consent-refuse"
- assertVisible:
    id: "home-screen"
- takeScreenshot: 02-home
- tapOn:
    id: "home-play"
- assertVisible:
    id: "game-tap-zone"
- tapOn:
    id: "game-tap-zone"
- tapOn:
    id: "game-tap-zone"
- takeScreenshot: 03-game
- extendedWaitUntil:
    visible: "Partie terminée"
    timeout: 20000
- takeScreenshot: 04-game-over
- tapOn:
    id: "game-home"
- assertVisible:
    id: "home-screen"
